server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

security:
  users:
    manager:
      username: ${DYNAMICSTAY_MANAGER_USERNAME:manager}
      password: ${DYNAMICSTAY_MANAGER_PASSWORD:local-manager-change-me}
    admin:
      username: ${DYNAMICSTAY_ADMIN_USERNAME:admin}
      password: ${DYNAMICSTAY_ADMIN_PASSWORD:local-admin-change-me}

pricing:
  seasonal:
    peak-multiplier: ${PRICING_SEASONAL_PEAK_MULTIPLIER:1.25}
    off-peak-multiplier: ${PRICING_SEASONAL_OFF_PEAK_MULTIPLIER:0.90}
  occupancy:
    high-threshold: ${PRICING_OCCUPANCY_HIGH_THRESHOLD:0.90}
    medium-threshold: ${PRICING_OCCUPANCY_MEDIUM_THRESHOLD:0.70}
    low-threshold: ${PRICING_OCCUPANCY_LOW_THRESHOLD:0.40}
    high-multiplier: ${PRICING_OCCUPANCY_HIGH_MULTIPLIER:1.50}
    medium-multiplier: ${PRICING_OCCUPANCY_MEDIUM_MULTIPLIER:1.25}
    low-multiplier: ${PRICING_OCCUPANCY_LOW_MULTIPLIER:1.05}
    empty-multiplier: ${PRICING_OCCUPANCY_EMPTY_MULTIPLIER:0.85}
  last-minute:
    immediate-days: ${PRICING_LAST_MINUTE_IMMEDIATE_DAYS:1}
    near-term-days: ${PRICING_LAST_MINUTE_NEAR_TERM_DAYS:3}
    short-term-days: ${PRICING_LAST_MINUTE_SHORT_TERM_DAYS:7}
    immediate-multiplier: ${PRICING_LAST_MINUTE_IMMEDIATE_MULTIPLIER:0.70}
    near-term-multiplier: ${PRICING_LAST_MINUTE_NEAR_TERM_MULTIPLIER:0.85}
    short-term-multiplier: ${PRICING_LAST_MINUTE_SHORT_TERM_MULTIPLIER:0.95}
  engine:
    last-minute-threshold-days: ${PRICING_ENGINE_LAST_MINUTE_THRESHOLD_DAYS:3}
    high-occupancy-threshold: ${PRICING_ENGINE_HIGH_OCCUPANCY_THRESHOLD:0.70}

spring:
  application:
    name: dynamicstay

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/dynamicstay}
    username: ${POSTGRES_USER:dynamicstay}
    password: ${POSTGRES_PASSWORD:dynamicstay}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates it matches.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/dynamicstay}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,mongo
        liveness:
          include: livenessState

logging:
  level:
    com.dynamicstay: INFO
    org.springframework.web: INFO
  pattern:
    level: "%5p [correlationId:%X{correlationId}]"

springdoc:
  swagger-ui:
    path: /swagger-ui
