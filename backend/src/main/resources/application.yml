server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: dynamicstay

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/dynamicstay}
    username: ${POSTGRES_USER:dynamicstay}
    password: ${POSTGRES_PASSWORD:dynamicstay}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates it matches.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/dynamicstay}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.dynamicstay: INFO
    org.springframework.web: INFO
