name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile
        run: mvn -B -DskipTests compile
      - name: Unit tests
        run: mvn -B test
      - name: Integration tests with Testcontainers
        run: mvn -B -Pintegration-test test
      - name: Package
        run: mvn -B -DskipTests package

  selenium:
    if: ${{ vars.DYNAMICSTAY_RUN_E2E == 'true' }}
    runs-on: ubuntu-latest
    needs: backend
    env:
      POSTGRES_DB: dynamicstay
      POSTGRES_USER: dynamicstay
      POSTGRES_PASSWORD: ci-postgres-password
      DYNAMICSTAY_MANAGER_USERNAME: manager
      DYNAMICSTAY_MANAGER_PASSWORD: ci-manager-password
      DYNAMICSTAY_ADMIN_USERNAME: admin
      DYNAMICSTAY_ADMIN_PASSWORD: ci-admin-password
      CORS_ALLOWED_ORIGINS: http://localhost:5500
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: docker/setup-buildx-action@v3
      - name: Start databases
        run: docker compose up -d
      - name: Start backend
        working-directory: backend
        run: mvn -B spring-boot:run > ../backend.log 2>&1 &
      - name: Wait for backend readiness
        run: |
          for i in {1..30}; do curl --fail http://localhost:8080/actuator/health/readiness && exit 0; sleep 2; done
          cat backend.log
          exit 1
      - name: Serve frontend
        working-directory: frontend
        run: python3 -m http.server 5500 > ../frontend.log 2>&1 &
      - name: Run Selenium suite
        working-directory: selenium-tests
        run: mvn -B test -Ddynamicstay.baseUrl=http://localhost:5500
      - name: Run admin cancellation scenario
        working-directory: selenium-tests
        run: mvn -B -Dtest=CancellationTest test -Ddynamicstay.baseUrl=http://localhost:5500 -Ddynamicstay.username=admin -Ddynamicstay.password=ci-admin-password
